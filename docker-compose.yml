# Local development database only. For a server, see docker-compose.prod.yml and docs/DEPLOY.md.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: yari
      POSTGRES_PASSWORD: yari
      POSTGRES_DB: yari
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-dbs.sql:/docker-entrypoint-initdb.d/init-test-dbs.sql:ro
volumes:
  pgdata:
